name: Sync version

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/write-version.js
      - name: Commit docs/version.js if changed
        run: |
          if git diff --quiet docs/version.js; then
            echo "version.js is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/version.js
          git commit -m "chore: sync docs/version.js with package.json"
          git push
